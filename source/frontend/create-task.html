<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Task · KU Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=48">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H13l-4.2 3.5a.6.6 0 0 1-1-.46V17H6.5A2.5 2.5 0 0 1 4 14.5v-9Z" fill="#fff"/>
          <circle cx="12" cy="10" r="2.6" fill="#0f766e"/>
        </svg>
      </span>
      <span>
        <div class="sidebar__title">KU Classroom</div>
        <div class="sidebar__subtitle">Course Support Portal</div>
      </span>
    </div>

    <!-- Inside a classroom the menu switches to the class menu. -->
    <nav class="nav">
      <a class="nav__item" href="my-classrooms.html"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg> Return to Classes</a>
      <a class="nav__item" href="#" id="announcementsLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 3 .7 4.4 1.5 5.4.4.5 0 1.3-.7 1.3H5.7c-.7 0-1.1-.8-.7-1.3.8-1 1.5-2.4 1.5-5.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Announcements</a>
      <a class="nav__item" href="#" id="assignmentLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 3h6v3H9zM9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Assignment</a>
      <a class="nav__item" href="#" id="timelineLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4M8 13.5h3M8 16.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Schedule</a>
      <a class="nav__item" href="#" id="membersLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.8M17 14.4a5 5 0 0 1 3.5 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Members</a>
      <a class="nav__item" href="#" id="chatLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.2a.5.5 0 0 1-.8-.4V17A2.5 2.5 0 0 1 4 14.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9.5h7M8.5 12.5h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Chat</a>
    </nav>

    <!-- Admin panel: the teaching team's staff chat and tasks, lecturer, TAs and University staff only -->
    <nav class="nav nav--bottom" aria-label="Staff">
      <a class="nav__item is-active" href="#" id="adminLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6l-7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Admin Panel</a>
    </nav>

    <div class="sidebar__user">
      <span class="avatar">··</span>
      <span>
        <div class="sidebar__user-name">…</div>
        <div class="sidebar__user-mail"></div>
      </span>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header__titles">
        <h1 id="classTitle">Loading…</h1>
        <div class="header__sub" id="classSub"></div>
      </div>
    </header>

    <main class="content">
      <!-- US-18: a new task for the teaching team, or editing one. -->
      <form class="form-card" id="taskForm" novalidate>
        <h2 class="form-card__title" id="formTitle">New task</h2>

        <div class="field" id="f-title">
          <label class="label" for="title">What needs doing <span class="req">*</span></label>
          <input class="input" id="title" maxlength="190" autocomplete="off" placeholder="e.g. Calibrate the lab machines in Room 204">
          <div class="hint">Say what needs doing.</div>
        </div>

        <div class="field">
          <label class="label" for="notes">Notes</label>
          <textarea class="input input--area" id="notes" rows="3" maxlength="2000" placeholder="Anything the person doing it needs to know"></textarea>
        </div>

        <div class="field">
          <label class="label">Assign to</label>
          <div class="picker" id="assignPicker"><div class="picker__empty">Loading…</div></div>
          <div class="hint hint--plain">Only the lecturer, TAs and University staff are listed. Students never are.</div>
        </div>

        <div class="form-row">
          <div class="field field--grow">
            <label class="label">Status</label>
            <div class="seg" id="statusPick">
              <button class="seg__btn is-on" type="button" data-status="open">Open</button>
              <button class="seg__btn" type="button" data-status="inprogress">In progress</button>
              <button class="seg__btn" type="button" data-status="done">Done</button>
            </div>
          </div>
          <div class="field field--grow" id="f-due">
            <label class="label" for="dueDate">Due date</label>
            <input class="input" id="dueDate" type="date" min="2020-01-01" max="2100-12-31">
            <div class="hint hint--plain">Optional.</div>
          </div>
        </div>

        <div class="form-actions form-actions--split">
          <a class="btn btn--ghost" id="cancelLink" href="#">Cancel</a>
          <span class="form-actions__right">
            <button class="btn--text-danger" type="button" id="deleteTask" hidden>Delete task</button>
            <button class="btn btn--primary" type="submit" id="saveTask">Create task</button>
          </span>
        </div>
      </form>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js?v=48"></script>
<script src="js/api.js?v=48"></script>
<script src="js/create-task.js?v=48"></script>
</body>
</html>
