<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Assignment · KU Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=31">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H13l-4.2 3.5a.6.6 0 0 1-1-.46V17H6.5A2.5 2.5 0 0 1 4 14.5v-9Z" fill="#fff"/>
          <circle cx="12" cy="10" r="2.6" fill="#0f766e"/>
        </svg>
      </span>
      <span>
        <div class="sidebar__title">KU Classroom</div>
        <div class="sidebar__subtitle">Course Support Portal</div>
      </span>
    </div>

    <!-- Inside a classroom the menu switches to the class menu. -->
    <nav class="nav">
      <a class="nav__item" href="my-classrooms.html"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg> Return to Classes</a>
      <a class="nav__item is-active" href="#" id="assignmentLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 3h6v3H9zM9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Class Assignment</a>
      <a class="nav__item" href="#" id="membersLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.8M17 14.4a5 5 0 0 1 3.5 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Members</a>
      <a class="nav__item" href="#" data-soon="Class Announcements"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 3 .7 4.4 1.5 5.4.4.5 0 1.3-.7 1.3H5.7c-.7 0-1.1-.8-.7-1.3.8-1 1.5-2.4 1.5-5.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Class Announcements</a>
    </nav>

    <div class="sidebar__user">
      <span class="avatar">··</span>
      <span>
        <div class="sidebar__user-name">…</div>
        <div class="sidebar__user-mail"></div>
      </span>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header__titles">
        <h1>Create Assignment</h1>
        <div class="header__sub" id="classSub"></div>
      </div>

    </header>

    <main class="content">
      <!-- US-5: title and due date are required. The staff note, the extra staff
           due date and Attach File are drawn from the Figma but not wired up -
           they belong to later stories, so they say so when you click them. -->
      <form class="form-card" id="assignmentForm" novalidate>

        <div class="form-row">
          <div class="field field--grow" id="f-title">
            <label class="label" for="title">Assignment Title <span class="req">*</span></label>
            <input class="input" id="title" placeholder="e.g. Lab 4: React Autolayout Mockup" autocomplete="off">
            <div class="hint">A title is required.</div>
          </div>
          <div class="field field--points">
            <label class="label" for="points">Assignment Point <span class="req">*</span></label>
            <input class="input" id="points" type="number" min="0" value="0">
          </div>
        </div>

        <div class="field">
          <label class="label" for="description">Description</label>
          <input class="input" id="description" placeholder="Write Assignment Description" autocomplete="off">
        </div>

        <div class="form-row">
          <div class="field field--grow" id="f-due">
            <label class="label" for="dueDate">Due Date &amp; Time <span class="req">*</span></label>
            <div class="datetime">
              <input class="input" id="dueDate" type="date" min="2020-01-01" max="2100-12-31">
              <input class="input input--time" id="dueTime" placeholder="23:59"
                     inputmode="numeric" maxlength="5" autocomplete="off">
            </div>
            <div class="hint">A valid due date and time is required.</div>
            <div class="hint hint--plain">Time is 24-hour. Leave it blank for 23:59.</div>
          </div>
        </div>

        <div class="field">
          <label class="label">Add TAs to this Assignment</label>
          <div class="picker" id="staffPicker">
            <div class="picker__empty">Loading…</div>
          </div>
        </div>

        <div class="field">
          <label class="label label--sub" for="staffDue">Add due date to staff</label>
          <div class="datetime">
            <input class="input" id="staffDue" type="date" min="2020-01-01" max="2100-12-31">
            <input class="input input--time" id="staffTime" placeholder="23:59"
                   inputmode="numeric" maxlength="5" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <input class="input" id="staffNote" placeholder="Write Note to staff" autocomplete="off">
        </div>

        <div class="field">
          <label class="label">Attach File</label>
          <div class="upload">
            <div class="upload__row">
              <span class="upload__title">Upload file</span>
              <span class="upload__note">File</span>
            </div>
            <button class="btn btn--primary" type="button" data-soon="File attachments">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 16V5m0 0L8 9m4-4 4 4M5 19h14" stroke="currentColor"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>Upload File
            </button>
          </div>
        </div>

        <div class="form-actions form-actions--split">
          <a class="btn btn--ghost" id="cancelLink" href="#">Cancel</a>
          <span class="form-actions__right">
            <button class="btn btn--ghost" type="button" id="saveDraft">Save as Draft</button>
            <button class="btn btn--primary" type="submit" id="publish">Publish Assignment</button>
          </span>
        </div>
      </form>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js?v=31"></script>
<script src="js/api.js?v=31"></script>
<script src="js/create-assignment.js?v=31"></script>
<script>
  // Anything marked data-soon is in the design but not built yet.
  document.querySelectorAll('[data-soon]').forEach(el => {
    if (el.tagName === 'INPUT') el.readOnly = true;
    el.addEventListener(el.tagName === 'INPUT' ? 'focus' : 'click', (e) => {
      e.preventDefault();
      if (el.tagName === 'INPUT') el.blur();
      KU.toast(el.dataset.soon + ' — not built yet');
    });
  });
</script>
</body>
</html>
