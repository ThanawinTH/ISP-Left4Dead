<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule · KU Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=48">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H13l-4.2 3.5a.6.6 0 0 1-1-.46V17H6.5A2.5 2.5 0 0 1 4 14.5v-9Z" fill="#fff"/>
          <circle cx="12" cy="10" r="2.6" fill="#0f766e"/>
        </svg>
      </span>
      <span>
        <div class="sidebar__title">KU Classroom</div>
        <div class="sidebar__subtitle">Course Support Portal</div>
      </span>
    </div>

    <!-- Inside a classroom the menu switches to the class menu. -->
    <nav class="nav">
      <a class="nav__item" href="my-classrooms.html"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg> Return to Classes</a>
      <a class="nav__item" href="#" id="announcementsLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 3 .7 4.4 1.5 5.4.4.5 0 1.3-.7 1.3H5.7c-.7 0-1.1-.8-.7-1.3.8-1 1.5-2.4 1.5-5.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Announcements</a>
      <a class="nav__item" href="#" id="assignmentLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 3h6v3H9zM9 12h6M9 16h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Assignment</a>
      <a class="nav__item is-active" href="#" id="timelineLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4M8 13.5h3M8 16.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Schedule</a>
      <a class="nav__item" href="#" id="membersLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.8M17 14.4a5 5 0 0 1 3.5 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Members</a>
      <a class="nav__item" href="#" id="chatLink"><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.2a.5.5 0 0 1-.8-.4V17A2.5 2.5 0 0 1 4 14.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9.5h7M8.5 12.5h4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Chat</a>
    </nav>

    <!-- Admin panel: the teaching team's staff chat and tasks, lecturer, TAs and University staff only -->
    <nav class="nav nav--bottom" aria-label="Staff">
      <a class="nav__item" href="#" id="adminLink" hidden><svg class="nav__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6l-7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Admin Panel</a>
    </nav>

    <div class="sidebar__user">
      <span class="avatar">··</span>
      <span>
        <div class="sidebar__user-name">…</div>
        <div class="sidebar__user-mail"></div>
      </span>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header__titles">
        <h1 id="classTitle">Loading…</h1>
        <div class="header__sub" id="classSub"></div>
      </div>
    </header>

    <main class="content">
      <!-- US-17: lab sessions, consultations, milestones and assignment due dates in one place,
           as a list by week or as a month calendar. Everyone in the class sees it; the lecturer,
           TAs and University staff add. (The file keeps the name timeline.html because
           class-schedule.html is the Assignment page.) -->
      <div class="timeline" id="timeline">
        <div class="filters timeline__bar">
          <a class="btn btn--primary" id="addEvent" href="#" hidden>
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Add to schedule
          </a>
          <div class="seg" id="kindPick" role="group" aria-label="Show">
            <button class="seg__btn is-on" type="button" data-kind="all">All</button>
            <button class="seg__btn" type="button" data-kind="lab">Labs</button>
            <button class="seg__btn" type="button" data-kind="consultation">Consultations</button>
            <button class="seg__btn" type="button" data-kind="milestone">Milestones</button>
            <button class="seg__btn" type="button" data-kind="due">Due dates</button>
          </div>
          <div class="timeline__right">
            <div class="seg" id="whenPick" role="group" aria-label="When">
              <button class="seg__btn is-on" type="button" data-when="upcoming">Upcoming</button>
              <button class="seg__btn" type="button" data-when="past">Past</button>
            </div>
            <div class="seg" id="viewPick" role="group" aria-label="View">
              <button class="seg__btn is-on" type="button" data-view="list" title="List by week">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>List</button>
              <button class="seg__btn" type="button" data-view="month" title="Month calendar">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Month</button>
            </div>
          </div>
        </div>

        <div id="weeks"><div class="empty">Loading the schedule…</div></div>

        <div class="cal-wrap" id="month" hidden>
          <section class="cal">
            <div class="cal__head">
              <h2 class="cal__title" id="monthName"></h2>
              <div class="cal__nav">
                <button class="btn btn--ghost btn--sm" type="button" id="todayBtn">Today</button>
                <button class="iconbtn" type="button" id="prevMonth" aria-label="Previous month">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <button class="iconbtn" type="button" id="nextMonth" aria-label="Next month">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              </div>
            </div>
            <div class="cal__days" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
            <div class="cal__grid" id="calGrid"></div>
          </section>
          <aside class="cal-panel" aria-live="polite">
            <div class="cal-panel__head">
              <h3 class="cal-panel__title" id="dayTitle"></h3>
              <a class="cal-panel__add" id="dayAdd" href="#" hidden>+ Add on this day</a>
            </div>
            <div class="cal-panel__items" id="dayItems"></div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js?v=48"></script>
<script src="js/api.js?v=48"></script>
<script src="js/timeline.js?v=48"></script>
</body>
</html>
