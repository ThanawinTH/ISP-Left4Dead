<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Schedule · KU Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H13l-4.2 3.5a.6.6 0 0 1-1-.46V17H6.5A2.5 2.5 0 0 1 4 14.5v-9Z" fill="#fff"/>
          <circle cx="12" cy="10" r="2.6" fill="#0f766e"/>
        </svg>
      </span>
      <span>
        <div class="sidebar__title">KU Classroom</div>
        <div class="sidebar__subtitle">Course Support Portal</div>
      </span>
    </div>

    <nav class="nav">
      <a class="nav__item" href="my-classrooms.html"><span class="dot"></span> Classes</a>
      <a class="nav__item is-active" href="class-schedule.html"><span class="dot"></span> Schedule</a>
    </nav>

    <div class="sidebar__user">
      <span class="avatar">KS</span>
      <span>
        <div class="sidebar__user-name">Dr. K. Sombat</div>
        <div class="sidebar__user-mail">kittipong.s@ku.th</div>
      </span>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="header__icon"></div>
      <div class="header__titles">
        <h1>01204223 Software Engineering</h1>
        <div class="header__sub">Semester 2566/1</div>
      </div>

      <div class="header__actions">
        <!-- SRS-2: the lecturer can copy and regenerate the join code -->
        <div class="codegroup">
          <span class="codegroup__code" id="joinCode">KU-489A</span>
          <button id="copyCode">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>Copy
          </button>
          <button id="regenCode">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>Regenerate
          </button>
        </div>
        <button class="btn btn--primary" id="newActivity">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>New Activity
        </button>
      </div>
    </header>

    <main class="content">
      <div class="schedule">

        <!-- ---------- Activity list ---------- -->
        <section>
          <!-- SRS-13: filtered list of Overdue / Due Soon / Unassigned -->
          <div class="filters">
            <button class="pill" id="atRisk"><span class="dot-sm"></span> At-Risk</button>
            <select class="select" id="filterType">
              <option value="all">All Types</option>
              <option value="homework">Homework</option>
              <option value="quiz">Quiz</option>
              <option value="project">Project</option>
              <option value="lab">Lab</option>
            </select>
            <select class="select" id="filterStatus">
              <option value="all">All Statuses</option>
              <option value="submitted">Submitted</option>
              <option value="duesoon">Due Soon</option>
              <option value="notstarted">Not Started</option>
              <option value="overdue">Overdue</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>

          <!-- SRS-13: activities ordered by due date, grouped by week -->
          <div id="weeks"></div>
          <div class="empty" id="emptyState" hidden>
            <strong>Nothing matches these filters</strong>
            No activities are at risk right now.
          </div>
        </section>

        <!-- ---------- Activity details ---------- -->
        <aside class="panel" id="panel"></aside>

      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
